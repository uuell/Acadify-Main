
services:
  - type: web
    name: acadify
    runtime: python
    region: singapore
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn "app:create_app('production')"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://acadify.online,https://www.acadify.online,https://acadify-frontend.torri8704.workers.dev/
